name: Lab Auto-Execute

on:
  workflow_dispatch:
    inputs:
      prompt_path:
        description: 'Path to the Lab prompt file (e.g. docs/lab/prompts/upload-cycle1-xxx.md)'
        required: true
        type: string
      dive_id:
        description: 'Lab deep dive UUID (for Discord/DB tracking)'
        required: true
        type: string
      feature_area:
        description: 'Feature area name'
        required: true
        type: string

jobs:
  execute-lab-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify prompt file exists
        run: |
          if [ ! -f "${{ inputs.prompt_path }}" ]; then
            echo "::error::Prompt file not found: ${{ inputs.prompt_path }}"
            exit 1
          fi
          echo "Prompt file exists"
          wc -l "${{ inputs.prompt_path }}"

      - name: Configure git
        run: |
          git config user.name "Lab Bot"
          git config user.email "lab-bot@viralanimal.com"

      - name: Create branch
        id: branch
        run: |
          BRANCH="lab/${{ inputs.feature_area }}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code with the Lab prompt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT_CONTENT=$(cat "${{ inputs.prompt_path }}")
          SAFETY_RULES=$(cat .github/claude-safety-rules.md)

          claude -p \
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm run build)" \
            --append-system-prompt "$SAFETY_RULES" \
            --max-turns 50 \
            "$PROMPT_CONTENT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::warning::Claude Code did not modify any files"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Files modified:"
            git diff --stat
          fi

      - name: Run build to verify
        if: steps.changes.outputs.has_changes == 'true'
        id: build
        run: npm run build
        continue-on-error: true

      - name: Commit + push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "feat(${{ inputs.feature_area }}): lab cycle auto-execute

          Implemented from prompt: ${{ inputs.prompt_path }}
          Lab dive ID: ${{ inputs.dive_id }}

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          BUILD_STATUS="${{ steps.build.outcome == 'success' && 'passes' || 'check logs' }}"

          PR_URL=$(gh pr create \
            --title "Lab: ${{ inputs.feature_area }} — auto-executed from cycle" \
            --body "$(cat <<EOF
          ## Auto-executed Lab recommendation

          **Feature**: ${{ inputs.feature_area }}
          **Prompt**: \`${{ inputs.prompt_path }}\`
          **Lab dive ID**: \`${{ inputs.dive_id }}\`
          **Build status**: ${BUILD_STATUS}

          ## Review checklist
          - [ ] Kill Switch concerns addressed
          - [ ] Build passes
          - [ ] No regression on existing features
          - [ ] Ship-it

          ---
          Generated by Lab Auto-Execute workflow
          EOF
          )" \
            --base master \
            --head "${{ steps.branch.outputs.branch }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Update lab_deep_dives with PR URL
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X PATCH "$SUPABASE_URL/rest/v1/lab_deep_dives?id=eq.${{ inputs.dive_id }}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"auto_pr_url\": \"${{ steps.pr.outputs.pr_url }}\", \"status\": \"pr_ready\"}"

      - name: Notify Discord (PR ready)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_READY_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          BUILD_STATUS="${{ steps.build.outcome }}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"embeds\":[{\"title\":\"Lab PR ready for review\",\"description\":\"**${{ inputs.feature_area }}** auto-executed by Claude Code\",\"fields\":[{\"name\":\"PR\",\"value\":\"${{ steps.pr.outputs.pr_url }}\",\"inline\":false},{\"name\":\"Build\",\"value\":\"${BUILD_STATUS}\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ steps.branch.outputs.branch }}\",\"inline\":true}],\"color\":56831,\"footer\":{\"text\":\"Lab Auto-Execute\"}}]}"

      - name: Notify Discord (no changes)
        if: steps.changes.outputs.has_changes == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_READY_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"embeds\":[{\"title\":\"Lab auto-execute: no changes\",\"description\":\"${{ inputs.feature_area }} — Claude Code made no modifications\",\"color\":16776960,\"footer\":{\"text\":\"Lab Auto-Execute\"}}]}"
