name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  vps-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for f in vps/routes/*.js vps/lib/*.js; do
            [ -f "$f" ] && node --check "$f" || true
          done

  db-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration file naming
        run: |
          BAD=""
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_.*\.sql$'; then
              echo "BAD: $base (expected YYYYMMDDHHmmss_name.sql)"
              BAD="$BAD $base"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::Migration files with wrong naming:$BAD"
            exit 1
          fi
          echo "All migration files follow YYYYMMDDHHmmss_name.sql format"
